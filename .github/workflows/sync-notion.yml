name: Sync Notion data

on:
  schedule:
    # 06:00 Costa Rica time (UTC-6) every day
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs

      - name: Commit updated data (if changed)
        run: |
          git config user.name "notion-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/employees.json data/logs.json data/last_sync.json
          git diff --cached --quiet || git commit -m "chore: sync data from Notion [skip ci]"
          git push
