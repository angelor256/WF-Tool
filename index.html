<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Roster & Filtros</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 20px;
        }
        h2, h3 {
            color: #2c3e50;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Sección de Filtros */
        .filter-section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eceff1;
        }
        .filter-btn {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-right: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .filter-btn:hover {
            background-color: #2c3e50;
        }
        .filter-btn.active {
            background-color: #3498db;
        }

        /* Sección de Grupos (Roster) */
        .groups-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .group-card {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        .group-card:hover {
            background-color: #d5dbdb;
            transform: translateY(-2px);
        }
        .group-card.selected {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        /* Tablas y Listas */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .hidden {
            display: none;
        }
        .view-title {
            margin-top: 20px;
            font-style: italic;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel de Control - Roster</h2>
    
    <!-- 1. SECCIÓN DE FILTROS DE HORARIO -->
    <div class="filter-section">
        <h3>Filtros por Horario de Entrada</h3>
        <button class="filter-btn active" onclick="filtrarPorHorario('todos', this)">Todos</button>
        <button class="filter-btn" onclick="filtrarPorHorario('manana', this)">Mañana (Incluye 8AM a 11AM)</button>
        <button class="filter-btn" onclick="filtrarPorHorario('tarde', this)">Tarde (9AM en adelante)</button>
    </div>

    <!-- 2. SECCIÓN DE GRUPOS DEL ROSTER -->
    <div class="filter-section">
        <h3>Grupos del Roster (Click para ver agentes asignados)</h3>
        <div class="groups-container">
            <!-- Usamos data-group para identificar la lógica de asignación -->
            <div class="group-card" data-group="Casino" onclick="filtrarPorGrupo('Casino', this)">A- Casino specialist</div>
            <div class="group-card" data-group="VIP" onclick="filtrarPorGrupo('VIP', this)">B- VIP</div>
            <div class="group-card" data-group="Phones" onclick="filtrarPorGrupo('Phones', this)">C- Phones</div>
        </div>
    </div>

    <!-- 3. TABLA PRINCIPAL DE AGENTES -->
    <h3 id="tabla-titulo" class="view-title">Mostrando: Todos los agentes</h3>
    <table>
        <thead>
            <tr>
                <th>Nombre del Agente</th>
                <th>Grupo</th>
                <th>Hora de Entrada</th>
            </tr>
        </thead>
        <tbody id="tbody-agentes">
            <!-- Los datos se inyectarán dinámicamente con JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Base de datos simulada de tu equipo
    const agentes = [
        { nombre: "Angelo Ramirez", grupo: "Casino", entrada: 8 },  // 8 AM
        { nombre: "Sofía Castro", grupo: "VIP", entrada: 6 },       // 6 AM
        { nombre: "Carlos Mendoza", grupo: "Phones", entrada: 9 },  // 9 AM
        { nombre: "Ana Gutiérrez", grupo: "Casino", entrada: 11 },  // 11 AM
        { nombre: "Luis Arce", grupo: "VIP", entrada: 13 },         // 1 PM
        { nombre: "Elena Gómez", grupo: "Phones", entrada: 15 },    // 3 PM
        { nombre: "David Miranda", grupo: "Casino", entrada: 10 }   // 10 AM
    ];

    // Función inicial para cargar toda la tabla al abrir la página
    function cargarTabla(listaAgentes) {
        const tbody = document.getElementById('tbody-agentes');
        tbody.innerHTML = ''; // Limpiar filas anteriores

        if (listaAgentes.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No hay agentes en este segmento.</td></tr>`;
            return;
        }

        listaAgentes.forEach(agente => {
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td><strong>${agente.nombre}</strong></td>
                <td>${agente.grupo}</td>
                <td>${agente.entrada}:00 AM/PM</td>
            `;
            tbody.appendChild(fila);
        });
    }

    // --- LÓGICA DE FILTRADO POR HORA (Solicitud 1) ---
    function filtrarPorHorario(turno, boton) {
        desmarcarBotonesYCards();
        boton.classList.add('active');
        
        let filtrados = [];
        const titulo = document.getElementById('tabla-titulo');

        if (turno === 'todos') {
            filtrados = agentes;
            titulo.textContent = "Mostrando: Todos los agentes";
        } 
        else if (turno === 'manana') {
            // Mañana: Entradas tempranas estándar (ej. 5-7 AM) + el rango solicitado de 8 AM a 11 AM
            filtrados = agentes.filter(a => a.entrada >= 5 && a.entrada <= 11);
            titulo.textContent = "Mostrando: Filtro Mañana (Entradas de 5:00 AM a 11:00 AM)";
        } 
        else if (turno === 'tarde') {
            // Tarde: Todos los que entran desde las 9 AM en adelante (9, 10, 11, 13, 15, etc.)
            filtrados = agentes.filter(a => a.entrada >= 9);
            titulo.textContent = "Mostrando: Filtro Tarde (Entradas desde las 9:00 AM en adelante)";
        }

        cargarTabla(filtrados);
    }

    // --- LÓGICA DE INTERACTIVIDAD DE GRUPOS (Solicitud 2) ---
    function filtrarPorGrupo(grupoNombre, elementoCard) {
        desmarcarBotonesYCards();
        elementoCard.classList.add('selected');

        // Filtrar el array global de agentes por la propiedad 'grupo'
        const filtrados = agentes.filter(a => a.grupo === grupoNombre);
        
        const titulo = document.getElementById('tabla-titulo');
        titulo.textContent = `Mostrando Agentes asignados al Grupo: ${grupoNombre}`;

        cargarTabla(filtrados);
    }

    // Función auxiliar para limpiar los estados visuales activos (clases CSS)
    function desmarcarBotonesYCards() {
        // Quitar estado activo de botones de hora
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        // Quitar estado seleccionado de las tarjetas de grupo
        document.querySelectorAll('.group-card').forEach(card => card.classList.remove('selected'));
    }

    // Carga inicial automatizada al abrir la app
    window.onload = function() {
        cargarTabla(agentes);
    };
</script>

</body>
</html>
