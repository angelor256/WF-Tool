<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetAnything Task Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   THEME — dark cyberpunk command center
    ═══════════════════════════════════════════════════  */
:root {
  --void: #06080c;
  --deep: #0b0e14;
  --surface: #0f1219;
  --surface2: #141820;
  --surface3: #1a1f2a;
  --surface4: #222836;
  --border: rgba(255,255,255,0.05);
  --border2: rgba(255,255,255,0.08);
  --border3: rgba(255,255,255,0.12);
  --text: #eaf0ff;
  --text2: #8892a8;
  --text3: #4e5670;
  --text4: #2d3444;
  --neon: #00f0ff;
  --neon-dim: rgba(0,240,255,0.08);
  --neon-mid: rgba(0,240,255,0.18);
  --neon-glow: 0 0 20px rgba(0,240,255,0.15), 0 0 60px rgba(0,240,255,0.06);
  --lime: #a3ff57;
  --lime-dim: rgba(163,255,87,0.08);
  --lime-mid: rgba(163,255,87,0.15);
  --hot: #ff3d71;
  --hot-dim: rgba(255,61,113,0.08);
  --hot-mid: rgba(255,61,113,0.15);
  --amber: #ffb057;
  --amber-dim: rgba(255,176,87,0.08);
  --amber-mid: rgba(255,176,87,0.15);
  --violet: #b47aff;
  --violet-dim: rgba(180,122,255,0.08);
  --violet-mid: rgba(180,122,255,0.15);
  --blue: #4d8eff;
  --blue-dim: rgba(77,142,255,0.08);
  --coral: #ff7a5c;
  --coral-dim: rgba(255,122,92,0.08);
  --gold: #ffd76a;
  --gold-dim: rgba(255,215,106,0.08);
  --slate: #7b8ba2;
  --slate-dim: rgba(123,139,162,0.08);
  --r: 12px;
  --r-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Figtree', sans-serif;
  background: var(--void);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* ── ANIMATED BG ── */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(0,240,255,0.03) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(180,122,255,0.025) 0%, transparent 60%);
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 20%, transparent 70%);
}
/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,14,20,0.85);
  backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid var(--border2);
  padding: 0 28px;
}
.nav-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; height: 56px; gap: 10px;
}
.logo {
  display: flex; align-items: center; gap: 12px;
}
.logo-icon {
  width: 32px; height: 32px; border-radius: 10px;
  background: linear-gradient(135deg, var(--neon) 0%, var(--violet) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: var(--void);
  box-shadow: var(--neon-glow);
  font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: .02em;
}
.logo-text {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 18px; font-weight: 700; letter-spacing: -.01em; color: var(--text);
}
.logo-ver {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  color: var(--neon); background: var(--neon-dim);
  border: 1px solid rgba(0,240,255,0.15);
  padding: 2px 8px; border-radius: 99px; letter-spacing: .06em;
}
.nav-tabs {
  display: flex; gap: 2px; margin-left: 28px;
  background: var(--surface); border-radius: 10px;
  padding: 3px; border: 1px solid var(--border);
}
.nav-tab {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
  color: var(--text3); padding: 7px 16px; border-radius: 8px;
  cursor: pointer; transition: all .2s; border: none; background: none;
  letter-spacing: .03em; white-space: nowrap;
}
.nav-tab:hover { color: var(--text2); }
.nav-tab.active {
  color: var(--neon); background: var(--neon-dim);
  box-shadow: inset 0 0 12px rgba(0,240,255,0.05);
}
.nav-spacer { flex: 1; }
.nav-status {
  display: flex; align-items: center; gap: 8px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text3); letter-spacing: .04em;
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 8px var(--lime), 0 0 20px rgba(163,255,87,0.2);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
/* ── CONTENT ── */
.content {
  position: relative; z-index: 1;
  max-width: 1400px; margin: 0 auto; padding: 24px 28px 80px;
}
.view { display: none; }
.view.active { display: block; animation: viewIn .4s ease; }
@keyframes viewIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
/* ── SECTION HEADER ── */
.sec-header { margin-bottom: 28px; }
.sec-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--neon); letter-spacing: .1em; text-transform: uppercase;
  margin-bottom: 10px;
}
.sec-tag::before {
  content: ''; width: 18px; height: 1px; background: var(--neon);
}
.sec-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(28px, 4.5vw, 42px); font-weight: 800; letter-spacing: -.02em;
  line-height: 1.05; color: var(--text); margin-bottom: 8px;
}
.sec-sub { font-size: 13px; color: var(--text2); line-height: 1.6; max-width: 600px; }
/* ── PANELS ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r); overflow: hidden;
  transition: border-color .3s;
}
.panel:hover { border-color: var(--border3); }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  gap: 12px; flex-wrap: wrap;
}
.panel-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text3);
}
.panel-body { padding: 18px; }
/* ── GRID LAYOUTS ── */
.grid-2 { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
@media (max-width: 960px) { .grid-2 { grid-template-columns: 1fr; } }
/* ── STAT CARDS ── */
.stat {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r); padding: 18px 20px;
  position: relative; overflow: hidden;
}
.stat::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.stat.s-neon::before { background: linear-gradient(90deg, var(--neon), transparent); }
.stat.s-lime::before { background: linear-gradient(90deg, var(--lime), transparent); }
.stat.s-violet::before { background: linear-gradient(90deg, var(--violet), transparent); }
.stat.s-amber::before { background: linear-gradient(90deg, var(--amber), transparent); }
.stat-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 8px;
}
.stat-val {
  font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px;
  font-weight: 800; line-height: 1; letter-spacing: -.02em;
}
.stat.s-neon .stat-val { color: var(--neon); }
.stat.s-lime .stat-val { color: var(--lime); }
.stat.s-violet .stat-val { color: var(--violet); }
.stat.s-amber .stat-val { color: var(--amber); }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }
/* ── TABLE ── */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  text-align: left; padding: 10px 14px;
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text4); background: var(--surface2);
  border-bottom: 1px solid var(--border2);
  white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .12s;
}
tbody tr:hover { background: rgba(0,240,255,0.02); }
tbody tr:last-child { border-bottom: none; }
td { padding: 9px 14px; white-space: nowrap; }
td.name-cell { font-weight: 600; color: var(--text); }
td.task-cell { white-space: normal; max-width: 280px; font-size: 11px; color: var(--text2); line-height: 1.5; }
td.mono { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
td.dim { color: var(--text3); }
/* ── GROUP CHIPS ── */
.g-chip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: var(--r-sm);
  font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px;
  letter-spacing: -.01em; font-weight: 700;
}
.g-A { background: var(--hot-dim); color: var(--hot); border: 1px solid var(--hot-mid); }
.g-B { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(77,142,255,0.15); }
.g-C { background: var(--lime-dim); color: var(--lime); border: 1px solid var(--lime-mid); }
.g-D { background: var(--violet-dim); color: var(--violet); border: 1px solid var(--violet-mid); }
.g-E { background: var(--coral-dim); color: var(--coral); border: 1px solid rgba(255,122,92,0.15); }
.g-F { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(255,215,106,0.15); }
.g-G { background: var(--slate-dim); color: var(--slate); border: 1px solid rgba(123,139,162,0.15); }
.q-tag {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 600; padding: 3px 10px; border-radius: 99px;
  letter-spacing: .04em;
}
.q-phones { background: var(--neon-dim); color: var(--neon); }
.q-chats { background: var(--violet-dim); color: var(--violet); }
.shift-tag {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 700; padding: 3px 10px; border-radius: 99px; letter-spacing: .04em;
}
.shift-am { background: var(--amber-dim); color: var(--amber); }
.shift-pm { background: var(--violet-dim); color: var(--violet); }
/* ── BUTTONS ── */
.btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700;
  border: none; border-radius: var(--r-sm); padding: 10px 20px;
  cursor: pointer; transition: all .2s; display: inline-flex;
  align-items: center; gap: 8px; letter-spacing: .04em;
  text-transform: uppercase;
}
.btn-glow {
  background: linear-gradient(135deg, var(--neon) 0%, #00c4cc 100%);
  color: var(--void); font-weight: 800;
  box-shadow: 0 0 20px rgba(0,240,255,0.2), 0 0 60px rgba(0,240,255,0.06);
}
.btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,240,255,0.35), 0 4px 20px rgba(0,240,255,0.15); }
.btn-glow:active { transform: translateY(0); }
.btn-ghost {
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border2);
}
.btn-ghost:hover { border-color: var(--border3); color: var(--text); background: var(--surface3); }
.btn-sm { padding: 7px 14px; font-size: 10px; }
.btn-danger { background: var(--hot-dim); color: var(--hot); border: 1px solid var(--hot-mid); }
.btn-danger:hover { background: var(--hot-mid); }
/* ── FORMS ── */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text3);
}
.field input, .field select {
  font-family: 'Figtree', sans-serif; font-size: 13px;
  padding: 9px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text); outline: none; transition: all .2s;
}
.field input:focus, .field select:focus { border-color: var(--neon); box-shadow: 0 0 12px rgba(0,240,255,0.08); }
.field select { cursor: pointer; }
.field input::placeholder { color: var(--text4); }
/* ── SCHEDULE ROWS ── */

  grid-template-columns: 28px 1fr 100px 100px 110px;
  gap:
