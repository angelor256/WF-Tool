/* ═══════════════════════════════════════════════════
   THEME — dark cyberpunk command center
   ═══════════════════════════════════════════════════ */
:root {
  --void: #06080c;
  --deep: #0b0e14;
  --surface: #0f1219;
  --surface2: #141820;
  --surface3: #1a1f2a;
  --surface4: #222836;
  --border: rgba(255,255,255,0.05);
  --border2: rgba(255,255,255,0.08);
  --border3: rgba(255,255,255,0.12);
  --text: #eaf0ff;
  --text2: #8892a8;
  --text3: #4e5670;
  --text4: #2d3444;

  --neon: #00f0ff;
  --neon-dim: rgba(0,240,255,0.08);
  --neon-mid: rgba(0,240,255,0.18);
  --neon-glow: 0 0 20px rgba(0,240,255,0.15), 0 0 60px rgba(0,240,255,0.06);

  --lime: #a3ff57;
  --lime-dim: rgba(163,255,87,0.08);
  --lime-mid: rgba(163,255,87,0.15);

  --hot: #ff3d71;
  --hot-dim: rgba(255,61,113,0.08);
  --hot-mid: rgba(255,61,113,0.15);

  --amber: #ffb057;
  --amber-dim: rgba(255,176,87,0.08);
  --amber-mid: rgba(255,176,87,0.15);

  --violet: #b47aff;
  --violet-dim: rgba(180,122,255,0.08);
  --violet-mid: rgba(180,122,255,0.15);

  --blue: #4d8eff;
  --blue-dim: rgba(77,142,255,0.08);

  --coral: #ff7a5c;
  --coral-dim: rgba(255,122,92,0.08);

  --gold: #ffd76a;
  --gold-dim: rgba(255,215,106,0.08);

  --slate: #7b8ba2;
  --slate-dim: rgba(123,139,162,0.08);

  --r: 12px;
  --r-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Figtree', sans-serif;
  background: var(--void);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── ANIMATED BG ── */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(0,240,255,0.03) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(180,122,255,0.025) 0%, transparent 60%);
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 20%, transparent 70%);
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,14,20,0.85);
  backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid var(--border2);
  padding: 0 28px;
}
.nav-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; height: 56px; gap: 10px;
}
.logo {
  display: flex; align-items: center; gap: 12px;
}
