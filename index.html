<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SQUAD TASK MAKER // SEMANAL</title>
    <style>
        :root {
            --neon-cyan: #00ffcc;
            --neon-magenta: #ff0055;
            --dark-bg: #0a0a0c;
            --panel-bg: #121216;
        }
        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: 2px solid var(--neon-magenta);
            color: var(--neon-magenta);
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(255, 0, 85, 0.2);
        }
        .tab-btn:hover, .tab-btn.active {
            background-color: var(--neon-magenta);
            color: #000;
            box-shadow: 0 0 15px var(--neon-magenta);
        }
        .tab-btn.active {
            border-color: var(--neon-cyan);
            background-color: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        .dashboard-panel {
            background-color: var(--panel-bg);
            border: 1px solid #222;
            padding: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        table.squad-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table.squad-table th {
            background-color: #181822;
            color: var(--neon-cyan);
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }
        table.squad-table td {
            border: 1px solid #222;
            padding: 10px;
            background-color: #0d0d11;
        }
        .tag-casino { color: #ffcc00; font-weight: bold; }
        .tag-secundaria { color: #00ff66; }
    </style>
</head>
<body>

    <h1>// SQUAD CRONOGRAMA SEMANAL //</h1>

    <div class="tabs-container" id="tabsMenu">
        <button class="tab-btn active" onclick="cambiarDia('Lunes')">[ Lunes ]</button>
        <button class="tab-btn" onclick="cambiarDia('Martes')">[ Martes ]</button>
        <button class="tab-btn" onclick="cambiarDia('Miercoles')">[ Miércoles ]</button>
        <button class="tab-btn" onclick="cambiarDia('Jueves')">[ Jueves ]</button>
        <button class="tab-btn" onclick="cambiarDia('Viernes')">[ Viernes ]</button>
        <button class="tab-btn" onclick="cambiarDia('Sabado')">[ Sábado ]</button>
        <button class="tab-btn" onclick="cambiarDia('Domingo')">[ Domingo ]</button>
    </div>

    <div class="dashboard-panel">
        <h2 id="currentDayTitle" style="color: var(--neon-cyan);">CRONOGRAMA: LUNES</h2>
        <div id="tablaContenedor"></div>
    </div>

    <script>
        let datosSemanales = {
            "Lunes": [],
            "Martes": [],
            "Miercoles": [],
            "Jueves": [],
            "Viernes": [],
            "Sabado": [],
            "Domingo": []
        };

        let diaActualActivo = "Lunes";

        document.addEventListener("DOMContentLoaded", () => {
            cargarDatosDesdeCSV();
        });

        function cargarDatosDesdeCSV() {
            fetch('cronograma.csv')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("No se detectó el archivo cronograma.csv en el repositorio.");
                    }
                    return response.text();
                })
                .then(csvTexto => {
                    procesarCSV(csvTexto);
                    distribuirTareasSemanales();
                    renderizarDia(diaActualActivo);
                })
                .catch(err => {
                    document.getElementById('tablaContenedor').innerHTML = 
                        `<p style="color: #ff0055;">ERROR CATASTRÓFICO: ${err.message}</p>`;
                });
        }

        function procesarCSV(texto) {
            const lineas = texto.split(/\r?\n/);
            for (let i = 1; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const columnas = lineas[i].split(',');
                
                let agente = columnas[0]?.trim();
                let diaUnformated = columnas[1]?.trim();
                let entrada = columnas[2]?.trim();
                let salida = columnas[3]?.trim();
                let estado = columnas[4]?.trim();

                let diaKey = unificarNombreDia(diaUnformated);

                if (datosSemanales[diaKey]) {
                    datosSemanales[diaKey].push({
                        nombre: agente,
                        entrada: entrada,
                        salida: salida,
                        estado: estado,
                        tareaPrincipal: 'Pendiente',
                        tareaSecundaria: 'Ninguna'
                    });
                }
            }
        }

        function unificarNombreDia(dia) {
            if (!dia) return "Lunes";
            let d = dia.toLowerCase();
            if (d.includes("lun")) return "Lunes";
            if (d.includes("mar")) return "Martes";
            if (d.includes("mie") || d.includes("mié")) return "Miercoles";
            if (d.includes("jue")) return "Jueves";
            if (d.includes("vie")) return "Viernes";
            if (d.includes("sab") || d.includes("sáb")) return "Sabado";
            if (d.includes("dom")) return "Domingo";
            return "Lunes";
        }

        function distribuirTareasSemanales() {
            Object.keys(datosSemanales).forEach(dia => {
                let agentesDelDia = datosSemanales[dia];
                let agentesActivos = agentesDelDia.filter(a => a.estado.toLowerCase() === 'work');

                agentesActivos.forEach((agente, index) => {
                    if (index % 3 === 0) {
                        agente.tareaPrincipal = 'Casino';
                    } else if (index % 3 === 1) {
                        agente.tareaPrincipal = 'VIP';
                    } else {
                        agente.tareaPrincipal = 'Soporte General';
                    }
                });

                let rolesSecundarios = ['Zelle Blast', 'Bonus Check', 'Email FollowUp'];
                let secundarioIndex = 0;

                agentesActivos.forEach(agente => {
                    if (agente.tareaPrincipal === 'Casino') {
                        agente.tareaSecundaria = 'EXENTO (Casino Dedicado)';
                    } else {
                        agente.tareaSecundaria = rolesSecundarios[secundarioIndex % rolesSecundarios.length];
                        secundarioIndex++;
                    }
                });
            });
        }

        function cambiarDia(diaTarget) {
            diaActualActivo = diaTarget;
            
            const botones = document.querySelectorAll('.tab-btn');
            botones.forEach(btn => {
                if(btn.textContent.toLowerCase().includes(diaTarget.toLowerCase().replace('e','é').replace('a','á'))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            document.getElementById('currentDayTitle').textContent = `CRONOGRAMA: ${diaTarget.toUpperCase()}`;
            renderizarDia(diaTarget);
        }

        function renderizarDia(dia) {
            const contenedor = document.getElementById('tablaContenedor');
            const agentes = datosSemanales[dia];

            if (!agentes || agentes.length === 0) {
                contenedor.innerHTML = '<p style="color: #666;">No hay datos programados para este día.</p>';
                return;
            }

            let html = `
                <table class="squad-table">
                    <thead>
                        <tr>
                            <th>Agente</th>
                            <th>Horario</th>
                            <th>Estado</th>
                            <th>Tarea Principal</th>
                            <th>Responsabilidad Secundaria</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            agentes.forEach(a => {
                let esCasino = a.tareaPrincipal === 'Casino';
                html += `
                    <tr>
                        <td style="font-weight: bold;">${a.nombre}</td>
                        <td>${a.entrada} - ${a.salida}</td>
                        <td style="color: ${a.estado.toLowerCase() === 'work' ? '#00ffcc' : '#ff0055'};">${a.estado}</td>
                        <td class="${esCasino ? 'tag-casino' : ''}">${a.estado.toLowerCase() === 'work' ? a.tareaPrincipal : '-'}</td>
                        <td class="tag-secundaria" style="opacity: ${esCasino ? '0.5' : '1'};">${a.estado.toLowerCase() === 'work' ? a.tareaSecundaria : '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
