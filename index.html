<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WF Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#10131a;
    --panel:#171b24;
    --panel2:#1d222c;
    --panel3:#232936;
    --border:#2a3040;
    --border-soft:#232936;
    --text:#e8eaef;
    --text-dim:#8890a0;
    --text-faint:#5b6272;
    --accent:#e2a33d;
    --accent-soft:rgba(226,163,61,.14);
    --accent-strong:#f0b658;
    --c-tardanza:#e2a33d;
    --c-ausencia:#e1565e;
    --c-vacacion:#5b8def;
    --c-request:#4fbf95;
    --c-nota:#8890a0;
    --radius:10px;
    --radius-lg:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{display:flex;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--border);
    padding:26px 18px 20px;
    display:flex;flex-direction:column;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-mark{width:34px;height:34px;flex-shrink:0;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:var(--text-faint);margin:2px 0 22px;letter-spacing:.4px;text-transform:uppercase;}

  .clock-wrap{display:flex;align-items:center;gap:12px;padding:14px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:22px;}
  .clock-face{position:relative;width:44px;height:44px;border-radius:50%;background:var(--panel3);border:1px solid var(--border);flex-shrink:0;}
  .clock-tick{position:absolute;width:2px;height:5px;background:var(--text-faint);left:50%;top:2px;transform-origin:1px 20px;}
  .clock-hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:2px;background:var(--text);}
  .hand-h{width:2.5px;height:11px;margin-left:-1.25px;background:var(--text);}
  .hand-m{width:2px;height:15px;margin-left:-1px;background:var(--text-dim);}
  .hand-s{width:1px;height:17px;margin-left:-.5px;background:var(--accent);}
  .clock-center{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);}
  .clock-text{display:flex;flex-direction:column;}
  .clock-time{font-size:15px;font-weight:500;letter-spacing:.5px;}
  .clock-day{font-size:11px;color:var(--text-faint);margin-top:2px;text-transform:capitalize;}

  .nav{display:flex;flex-direction:column;gap:4px;}
  .nav-btn{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;
    border:1px solid transparent;background:transparent;text-align:left;width:100%;
    transition:background .12s,color .12s;
  }
  .nav-btn:hover{background:var(--panel2);color:var(--text);}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent-strong);border-color:rgba(226,163,61,.25);}
  .nav-btn svg{width:16px;height:16px;flex-shrink:0;}

  .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);}
  .sidebar-footer .who{font-size:11.5px;color:var(--text-faint);line-height:1.5;}
  .sidebar-footer .who b{color:var(--text-dim);}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;padding:32px 40px 60px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:20px;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:.2px;}
  .page-sub{color:var(--text-dim);font-size:13px;margin-top:4px;max-width:520px;line-height:1.5;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:20px;}
  .card-title{font-size:12.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;}

  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1;}
  .field label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
  input,select,textarea{
    background:var(--panel3);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:'Inter',sans-serif;outline:none;
    width:100%;
  }
  input.mono,textarea.mono{font-family:'IBM Plex Mono',monospace;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:64px;}

  .btn{
    background:var(--accent);color:#1a1408;border:none;border-radius:8px;
    padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .12s,transform .05s;
  }
  .btn:hover{background:var(--accent-strong);}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);border-color:var(--text-faint);}
  .btn.danger{background:transparent;border:1px solid rgba(225,86,94,.4);color:var(--c-ausencia);}
  .btn.danger:hover{background:rgba(225,86,94,.1);}
  .btn.small{padding:6px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;font-size:13.5px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--panel2);}

  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tag.tardanza{color:var(--c-tardanza);background:rgba(226,163,61,.12);}
  .tag.ausencia{color:var(--c-ausencia);background:rgba(225,86,94,.12);}
  .tag.vacacion{color:var(--c-vacacion);background:rgba(91,141,239,.12);}
  .tag.request{color:var(--c-request);background:rgba(79,191,149,.12);}
  .tag.nota{color:var(--c-nota);background:rgba(136,144,160,.12);}

  .empty{color:var(--text-faint);font-size:13px;padding:24px 8px;text-align:center;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,10,14,.7);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:440px;max-width:92vw;max-height:86vh;overflow-y:auto;}
  .modal h3{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 16px;}
  .modal .row{margin-bottom:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .stat-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .stat{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
  .stat-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}

  .report-out{background:var(--panel3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:pre-wrap;line-height:1.6;color:var(--text-dim);max-height:420px;overflow-y:auto;}

  .tpl-grid{display:grid;grid-template-columns:230px 1fr;gap:20px;}
  .tpl-list{display:flex;flex-direction:column;gap:6px;}
  .tpl-item{padding:10px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--text-dim);background:var(--panel2);}
  .tpl-item.active{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);}
  .preview-box{background:var(--panel3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;min-height:220px;}
  .preview-subject{font-size:12px;color:var(--text-faint);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel3);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}

  .note-banner{font-size:11.5px;color:var(--text-faint);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:18px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;}
    .brand{margin-bottom:0;}
    .clock-wrap{display:none;}
    .nav{flex-direction:row;flex-wrap:wrap;}
    .sidebar-footer{display:none;}
    .main{padding:20px;}
    .tpl-grid{grid-template-columns:1fr;}
  }
</style>

async function initFirebase(){
  if(FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") return false; // not configured yet
  if(typeof firebase === 'undefined') return false; // SDK failed to load (offline?)
  try{

    await firebase.auth().signInAnonymously();

  }catch(e){

}

// window.storage only exists inside Claude.ai (it's what lets you and Cris
// share data live there). When this file is hosted elsewhere (e.g. Firebase
// Hosting) or opened directly as a file, that API doesn't exist, so storage
// falls back in this order: Firebase Firestore (if configured above) →
// Claude.ai cloud storage (if running inside Claude.ai) → this browser's
// localStorage → a plain in-memory object, so the app never just dies with
// a blank screen.
const hasCloudStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const memStore = {};

async function storageGet(key, shared){
  if(firebaseReady){
    const snap = await fsDb.collection('wfcontrol').doc(key).get();
    if(!snap.exists) throw new Error('missing');
    return {value: snap.data().value};
  }
  if(hasCloudStorage) return await window.storage.get(key, shared);
  try{
    const raw = localStorage.getItem('wfcontrol:'+key);
    if(raw===null) throw new Error('missing');
    return {value: raw};
  }catch(e){
    if(!(key in memStore)) throw new Error('missing');
    return {value: memStore[key]};
  }
}
async function storageSet(key, value, shared){
  if(firebaseReady){
    await fsDb.collection('wfcontrol').doc(key).set({value, updatedAt: Date.now()});
    return {value};
  }
  if(hasCloudStorage) return await window.storage.set(key, value, shared);
  try{ localStorage.setItem('wfcontrol:'+key, value); }
  catch(e){ memStore[key] = value; }
  return {value};
}

// Tries to fetch fresh data synced from Notion by the GitHub Action
// (data/employees.json + data/logs.json, served next to this HTML file).
// Falls back to null if those files don't exist yet (e.g. the Action
// hasn't run, or this file was opened standalone without that data/ folder).
async function fetchNotionSeedData(){
  try{
    const [empRes, logRes] = await Promise.all([
      fetch('./data/employees.json', {cache:'no-store'}),
      fetch('./data/logs.json', {cache:'no-store'}),
    ]);
    if(!empRes.ok || !logRes.ok) return null;
    const employees = await empRes.json();
    const logs = await logRes.json();
    if(!Array.isArray(employees) || !Array.isArray(logs)) return null;
    return {employees, logs};
  }catch(e){
    return null;
  }
}

async function loadData(){
  await initFirebase();
  try{
    const r = await storageGet('wf:employees', true);
    state.employees = JSON.parse(r.value);
  }catch(e){
    const fresh = await fetchNotionSeedData();
    state.employees = fresh ? fresh.employees : SEED_EMPLOYEES;
    try{ await storageSet('wf:employees', JSON.stringify(state.employees), true); }catch(e2){}
  }
  try{
    const r = await storageGet('wf:logs', true);
    state.logs = JSON.parse(r.value);
  }catch(e){
    const fresh = await fetchNotionSeedData();
    state.logs = fresh ? fresh.logs : SEED_LOGS;
    try{ await storageSet('wf:logs', JSON.stringify(state.logs), true); }catch(e2){}
  }
  state.ready = true;
  render();
}

function startClock(){
  clearInterval(window.__clockInt);
  function tick(){
    const cr = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Costa_Rica'}));
    const h = cr.getHours(), m = cr.getMinutes(), s = cr.getSeconds();
    const hh = document.getElementById('handH');
    const hm = document.getElementById('handM');
    const hs = document.getElementById('handS');
    if(!hh) return;
    hh.style.transform = `rotate(${(h%12)*30 + m*0.5}deg)`;
    hm.style.transform = `rotate(${m*6}deg)`;
    hs.style.transform = `rotate(${s*6}deg)`;
    const timeEl = document.getElementById('clockTime');
    const dayEl = document.getElementById('clockDay');
    if(timeEl) timeEl.textContent = cr.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'});
    if(dayEl) dayEl.textContent = cr.toLocaleDateString('es-CR',{weekday:'long', day:'numeric', month:'short'});
  }
  tick();
  window.__clockInt = setInterval(tick, 1000);
}

        <div class="page-sub">Registro de tardías, ausencias, vacaciones y special requests por clerk. Esto alimenta los Reportes.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Nuevo registro</div>
      <div class="row">
        <div class="field"><label>Clerk</label>
          <select id="logEmp">${empOptions.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Fecha</label><input id="logDate" type="date" value="${todayStr()}"></div>
        <div class="field"><label>Tipo</label>
          <select id="logType">${LOG_TYPES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('')}</select>
        </div>
        <div class="field" id="logDaysWrap" style="display:none;max-width:110px;"><label>Días</label><input id="logDays" type="number" class="mono" value="1" min="0.5" step="0.5"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="field" style="flex:3;"><label>Detalle</label><textarea id="logDetail" placeholder="Ej: llegó 20 min tarde, avisó por Slack…"></textarea></div>
      </div>
      <div style="margin-top:10px;"><button class="btn" id="addLogBtn">+ Agregar registro</button></div>
    </div>

    <div class="card">
      <div class="card-title">Historial</div>
      <div class="row" style="margin-bottom:14px;">
        <div class="field"><label>Clerk</label>
          <select id="filtEmp">
            <option value="all" ${f.emp==='all'?'selected':''}>Todos</option>
            ${empOptions.map(e=>`<option value="${e.id}" ${f.emp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Tipo</label>
          <select id="filtTipo">
            <option value="all" ${f.tipo==='all'?'selected':''}>Todos</option>
            ${LOG_TYPES.map(t=>`<option value="${t.id}" ${f.tipo===t.id?'selected':''}>${t.label}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="max-width:160px;"><label>Desde</label><input id="filtFrom" type="date" value="${f.from}"></div>
        <div class="field" style="max-width:160px;"><label>Hasta</label><input id="filtTo" type="date" value="${f.to}"></div>
      </div>
      ${entries.length ? `
      <table>
        <thead><tr><th>Fecha</th><th>Clerk</th><th>Tipo</th><th>Detalle</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty">Sin registros con estos filtros.</div>`}
    </div>
  `;
}

function addLogEntry(){
  const employeeId = document.getElementById('logEmp').value;
  const date = document.getElementById('logDate').value || todayStr();
  const type = document.getElementById('logType').value;
  const detail = document.getElementById('logDetail').value.trim();
  const days = type==='vacacion' ? (parseFloat(document.getElementById('logDays').value)||1) : null;
  if(!employeeId){ showToast('Seleccioná un clerk.'); return; }
  state.logs.push({id:uid(), employeeId, date, type, detail, days});
  persistLogs();
  showToast('Registro agregado.');
  renderInto();
}
function deleteLogEntry(id){
  state.logs = state.logs.filter(l=>l.id!==id);
  persistLogs();
  renderInto();
  showToast('Registro eliminado.');
}

/* ============================================================
   TAB 3 — REPORTES
   ============================================================ */
function renderReportes(){
  const empOptions = state.employees.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const r = state.reporte;

  setTimeout(()=>{
    document.getElementById('repEmp').onchange = e=>{ state.reporte.empId = e.target.value; renderInto(); };
    document.getElementById('repFrom').onchange = e=>{ state.reporte.from = e.target.value; renderInto(); };
    document.getElementById('repTo').onchange = e=>{ state.reporte.to = e.target.value; renderInto(); };
    document.getElementById('genRepBtn').onclick = generateReport;
  },0);

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Reportes</div>
        <div class="page-sub">Armá un reporte de un clerk (tardías, ausencias, vacaciones, requests) listo para enviar o guardar.</div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="field"><label>Clerk</label>
          <select id="repEmp">
            <option value="">Seleccioná…</option>
            ${empOptions.map(e=>`<option value="${e.id}" ${r.empId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="max-width:160px;"><label>Desde</label><input id="repFrom" type="date" value="${r.from}"></div>
        <div class="field" style="max-width:160px;"><label>Hasta</label><input id="repTo" type="date" value="${r.to}"></div>
        <button class="btn" id="genRepBtn" style="height:38px;">Generar reporte</button>
      </div>
    </div>

    ${r.output ? renderReportOutput() : ''}
  `;
}

function generateReport(){
  const r = state.reporte;
  if(!r.empId){ showToast('Seleccioná un clerk primero.'); return; }
  const emp = state.employees.find(e=>e.id===r.empId);
  let entries = state.logs.filter(l=>l.employeeId===r.empId);
  if(r.from) entries = entries.filter(l=>l.date>=r.from);
  if(r.to) entries = entries.filter(l=>l.date<=r.to);
  entries.sort((a,b)=>a.date.localeCompare(b.date));

  const byType = id => entries.filter(l=>l.type===id);
  const tardanzas = byType('tardanza');
  const ausencias = byType('ausencia');
  const vacaciones = byType('vacacion');
  const requests = byType('request');
  const notas = byType('nota');

  const vacDaysUsedTotal = state.logs.filter(l=>l.employeeId===r.empId && l.type==='vacacion').reduce((s,l)=>s+(l.days||0),0);
  const vacRemaining = (emp.vacDays||12) - vacDaysUsedTotal;
  const vacDaysUsedRange = vacaciones.reduce((s,l)=>s+(l.days||0),0);

  const rangeLabel = (r.from||r.to) ? `${r.from||'…'} a ${r.to||'…'}` : 'histórico completo';

  const lines = [];
  lines.push(`REPORTE DE ASISTENCIA — ${emp.name.toUpperCase()}`);
  lines.push(`Equipo: ${emp.team}${emp.group?' · Grupo '+emp.group:''}`);
  lines.push(`Periodo del reporte: ${rangeLabel}`);
  lines.push('');
  lines.push(`Tardanzas: ${tardanzas.length}`);
  tardanzas.forEach(l=>lines.push(`  - ${l.date}: ${l.detail||'(sin detalle)'}`));
  lines.push('');
  lines.push(`Ausencias: ${ausencias.length}`);
  ausencias.forEach(l=>lines.push(`  - ${l.date}: ${l.detail||'(sin detalle)'}`));
  lines.push('');
  lines.push(`Vacaciones en el periodo: ${vacaciones.length} registro(s), ${vacDaysUsedRange} día(s)`);
  vacaciones.forEach(l=>lines.push(`  - ${l.date}: ${l.days||1} día(s) — ${l.detail||''}`.trim()));
  lines.push(`  Total histórico usado: ${vacDaysUsedTotal} de ${emp.vacDays||12} días · Restantes: ${vacRemaining}`);
  lines.push('');
  lines.push(`Special Requests: ${requests.length}`);
  requests.forEach(l=>lines.push(`  - ${l.date}: ${l.detail||'(sin detalle)'}`));
  if(notas.length){
    lines.push('');
    lines.push(`Notas generales: ${notas.length}`);
    notas.forEach(l=>lines.push(`  - ${l.date}: ${l.detail||''}`));
  }

  state.reporte.output = {
    text: lines.join('\n'),
    stats: {tardanzas:tardanzas.length, ausencias:ausencias.length, vacDaysUsedRange, requests:requests.length, vacRemaining},
    empName: emp.name, empTeam: emp.team, empGroup: emp.group, rangeLabel,
    vacDaysUsedTotal, vacAllowed: emp.vacDays||12,
    sections: {
      tardanzas: tardanzas.map(l=>({date:l.date, detail:l.detail||'(sin detalle)'})),
      ausencias: ausencias.map(l=>({date:l.date, detail:l.detail||'(sin detalle)'})),
      vacaciones: vacaciones.map(l=>({date:l.date, days:l.days||1, detail:l.detail||''})),
      requests: requests.map(l=>({date:l.date, detail:l.detail||'(sin detalle)'})),
      notas: notas.map(l=>({date:l.date, detail:l.detail||''})),
    }
  };
  renderInto();
}

function renderReportOutput(){
  const o = state.reporte.output;
  const s = o.stats;
  return `
  <div class="card">
    <div class="card-title">Resumen</div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-num" style="color:var(--c-tardanza)">${s.tardanzas}</div><div class="stat-label">Tardanzas</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--c-ausencia)">${s.ausencias}</div><div class="stat-label">Ausencias</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--c-vacacion)">${s.vacDaysUsedRange}</div><div class="stat-label">Días vac. (periodo)</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--c-request)">${s.requests}</div><div class="stat-label">Special Requests</div></div>
      <div class="stat"><div class="stat-num">${s.vacRemaining}</div><div class="stat-label">Vac. restantes</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Reporte (texto)</div>
    <div class="report-out">${esc(state.reporte.output.text)}</div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn" id="copyReportBtn">Copiar reporte</button>
      <button class="btn ghost" id="downloadPdfBtn">⭳ Descargar PDF</button>
    </div>
  </div>`;
}

function copyReportText(){
  const text = state.reporte.output?.text || '';
  navigator.clipboard?.writeText(text).then(()=>showToast('Reporte copiado.')).catch(()=>showToast('No se pudo copiar.'));
}

function downloadReportPDF(){
  const o = state.reporte.output;
  if(!o){ showToast('Generá el reporte primero.'); return; }
  if(typeof window.jspdf === 'undefined'){
    showToast('No se pudo cargar el generador de PDF (revisá tu conexión).');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 42;
  let y = 50;

  const amber = [217, 119, 6];
  const dark = [15, 23, 42];
  const gray = [100, 116, 139];
  const lightGray = [148, 163, 184];

  function ensureSpace(need){
    if(y + need > pageH - 50){
      doc.addPage();
      y = 50;
    }
  }

  // Header
  doc.setDrawColor(...amber);
  doc.setLineWidth(1.2);
  doc.circle(marginX+10, y-6, 10, 'S');
  doc.line(marginX+10, y-6, marginX+10, y-12);
  doc.line(marginX+10, y-6, marginX+15, y-3);

  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.setTextColor(...amber);
  doc.text('WORKFORCE · CUSTOMER SERVICE', marginX+28, y-9);

  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  doc.setTextColor(...dark);
  doc.text('Reporte de Asistencia', marginX+28, y+8);

  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);
  doc.setTextColor(...gray);
  const genDate = new Date().toLocaleDateString('es-CR',{day:'2-digit',month:'2-digit',year:'numeric'});
  doc.text(`Generado: ${genDate}`, pageW-marginX, y-9, {align:'right'});
  doc.text(`Periodo: ${o.rangeLabel}`, pageW-marginX, y+2, {align:'right'});

  y += 26;
  doc.setDrawColor(...amber);
  doc.setLineWidth(2);
  doc.line(marginX, y, pageW-marginX, y);
  y += 26;

  // Clerk name + team
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.setTextColor(...dark);
  doc.text(o.empName, marginX, y);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(...gray);
  doc.text(`${o.empTeam}${o.empGroup?' · Grupo '+o.empGroup:''}`, marginX, y+15);
  y += 36;

  // Stat cards
  const stats = [
    {label:'Tardanzas', val:o.stats.tardanzas, color:[226,163,61]},
    {label:'Ausencias', val:o.stats.ausencias, color:[225,86,94]},
    {label:'Días vac. (periodo)', val:o.stats.vacDaysUsedRange, color:[91,141,239]},
    {label:'Special Requests', val:o.stats.requests, color:[79,191,149]},
    {label:'Vac. restantes', val:o.stats.vacRemaining, color:dark},
  ];
  const cardW = (pageW - marginX*2 - 4*8) / 5;
  stats.forEach((st,i)=>{
    const cx = marginX + i*(cardW+8);
    doc.setFillColor(248,250,252);
    doc.setDrawColor(226,232,240);
    doc.roundedRect(cx, y, cardW, 44, 4, 4, 'FD');
    doc.setDrawColor(...st.color);
    doc.setLineWidth(2.5);
    doc.line(cx, y+2, cx, y+42);
    doc.setFont('helvetica','bold');
    doc.setFontSize(16);
    doc.setTextColor(...dark);
    doc.text(String(st.val), cx+10, y+22);
    doc.setFont('helvetica','normal');
    doc.setFontSize(6.8);
    doc.setTextColor(...gray);
    const labelLines = doc.splitTextToSize(st.label.toUpperCase(), cardW-14);
    doc.text(labelLines, cx+10, y+33);
  });
  y += 64;

  function section(title, color, items, renderLine){
    ensureSpace(30);
    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.setTextColor(...dark);
    doc.text(title, marginX, y);
    doc.setDrawColor(226,232,240);
    doc.setLineWidth(0.75);
    doc.line(marginX, y+4, pageW-marginX, y+4);
    y += 16;
    if(!items.length){
      doc.setFont('helvetica','normal');
      doc.setFontSize(9);
      doc.setTextColor(...lightGray);
      doc.text('Sin registros en este periodo.', marginX+4, y);
      y += 16;
      return;
    }
    items.forEach(item=>{
      const line = renderLine(item);
      const wrapped = doc.splitTextToSize(line, pageW - marginX*2 - 10);
      ensureSpace(wrapped.length*12 + 4);
      doc.setFillColor(...color);
      doc.circle(marginX+3, y-3, 1.6, 'F');
      doc.setFont('helvetica','normal');
      doc.setFontSize(9);
      doc.setTextColor(...dark);
      doc.text(wrapped, marginX+10, y);
      y += wrapped.length*12 + 4;
    });
    y += 8;
  }

  section('Tardanzas', [226,163,61], o.sections.tardanzas, it=>`${it.date} — ${it.detail}`);
  section('Ausencias', [225,86,94], o.sections.ausencias, it=>`${it.date} — ${it.detail}`);
  section('Vacaciones', [91,141,239], o.sections.vacaciones, it=>`${it.date} — ${it.days} dia(s) — ${it.detail}`.replace(/ — $/,''));
  section('Special Requests', [79,191,149], o.sections.requests, it=>`${it.date} — ${it.detail}`);
  if(o.sections.notas.length){
    section('Notas Generales', [136,144,160], o.sections.notas, it=>`${it.date} — ${it.detail}`);
  }

  ensureSpace(20);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(...lightGray);
  doc.text(`Total histórico de vacaciones usadas: ${o.vacDaysUsedTotal} de ${o.vacAllowed} dias asignados.`, marginX, y);

  // Footer with page numbers
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.5);
    doc.setTextColor(...lightGray);
    doc.text(`Workforce · Customer Service — Confidencial · Página ${i} de ${pageCount}`, pageW/2, pageH-24, {align:'center'});
  }

  const safeName = o.empName.replace(/[^a-z0-9]+/gi,'_');
  doc.save(`Reporte_${safeName}.pdf`);
  showToast('PDF descargado.');
}

/* ============================================================
   TAB 4 — CORREOS
   ============================================================ */
function renderCorreos(){
  const c = state.correo;
  const tpl = TEMPLATES.find(t=>t.id===c.tplId);

  setTimeout(()=>{
    document.querySelectorAll('[data-tpl]').forEach(b=>{
      b.onclick = ()=>{ state.correo.tplId = b.dataset.tpl; state.correo.values = {}; renderInto(); };
    });
    tpl.fields.forEach(f=>{
      const el = document.getElementById('mf_'+f.k);
      if(el) el.oninput = e=>{ state.correo.values[f.k] = e.target.value; updateMailPreview(); };
    });
  },0);

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Correos</div>
        <div class="page-sub">Templates estandarizados para special requests, vacaciones y horarios de universidad. Llená los campos y copiá.</div>
      </div>
    </div>
    <div class="tpl-grid">
      <div class="tpl-list">
        ${TEMPLATES.map(t=>`<div class="tpl-item ${t.id===c.tplId?'active':''}" data-tpl="${t.id}">${t.label}</div>`).join('')}
      </div>
      <div>
        <div class="card">
          <div class="card-title">Datos</div>
          ${tpl.fields.map(f=>`
            <div class="field" style="margin-bottom:10px;">
              <label>${f.label}</label>
              ${f.type==='textarea'
                ? `<textarea id="mf_${f.k}">${esc(c.values[f.k]||'')}</textarea>`
                : `<input id="mf_${f.k}" type="${f.type}" value="${esc(c.values[f.k]||'')}">`}
            </div>
          `).join('')}
        </div>
        <div class="card">
          <div class="card-title">Vista previa</div>
          <div class="preview-subject" id="mailSubject">${esc(fillTemplate(tpl.subject, c.values))}</div>
          <div class="preview-box" id="mailBody">${esc(fillTemplate(tpl.body, c.values))}</div>
          <div style="margin-top:12px;"><button class="btn" id="copyMailBtn">Copiar correo</button></div>
        </div>
      </div>
    </div>
  `;
}

function fillTemplate(str, values){
  return str.replace(/\{\{(\w+)\}\}/g, (_,k)=> values[k] && values[k].trim() ? values[k] : `[${k}]`);
}
function updateMailPreview(){
  const tpl = TEMPLATES.find(t=>t.id===state.correo.tplId);
  document.getElementById('mailSubject').textContent = fillTemplate(tpl.subject, state.correo.values);
  document.getElementById('mailBody').textContent = fillTemplate(tpl.body, state.correo.values);
}
function copyMailText(){
  const tpl = TEMPLATES.find(t=>t.id===state.correo.tplId);
  const full = `Asunto: ${fillTemplate(tpl.subject, state.correo.values)}\n\n${fillTemplate(tpl.body, state.correo.values)}`;
  navigator.clipboard?.writeText(full).then(()=>showToast('Correo copiado.')).catch(()=>showToast('No se pudo copiar.'));
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('error', function(ev){
  if(!state.ready){
    document.getElementById('app').innerHTML =
      `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-size:13px;max-width:500px;margin:0 auto;text-align:center;padding:20px;">
        Algo impidió cargar WF Control (${esc(ev.message||'error desconocido')}).<br>Probá recargar la página.
      </div>`;
  }
});

loadData().catch(err=>{
  state.ready = true;
  state.employees = state.employees.length ? state.employees : SEED_EMPLOYEES;
  state.logs = state.logs || [];
  render();
});
</script>
