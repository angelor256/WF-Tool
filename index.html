<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetAnything Task Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   THEME — dark cyberpunk command center
   ═══════════════════════════════════════════════════ */
:root {
  --void: #06080c;
  --deep: #0b0e14;
  --surface: #0f1219;
  --surface2: #141820;
  --surface3: #1a1f2a;
  --surface4: #222836;
  --border: rgba(255,255,255,0.05);
  --border2: rgba(255,255,255,0.08);
  --border3: rgba(255,255,255,0.12);
  --text: #eaf0ff;
  --text2: #8892a8;
  --text3: #4e5670;
  --text4: #2d3444;

  --neon: #00f0ff;
  --neon-dim: rgba(0,240,255,0.08);
  --neon-mid: rgba(0,240,255,0.18);
  --neon-glow: 0 0 20px rgba(0,240,255,0.15), 0 0 60px rgba(0,240,255,0.06);

  --lime: #a3ff57;
  --lime-dim: rgba(163,255,87,0.08);
  --lime-mid: rgba(163,255,87,0.15);

  --hot: #ff3d71;
  --hot-dim: rgba(255,61,113,0.08);
  --hot-mid: rgba(255,61,113,0.15);

  --amber: #ffb057;
  --amber-dim: rgba(255,176,87,0.08);
  --amber-mid: rgba(255,176,87,0.15);

  --violet: #b47aff;
  --violet-dim: rgba(180,122,255,0.08);
  --violet-mid: rgba(180,122,255,0.15);

  --blue: #4d8eff;
  --blue-dim: rgba(77,142,255,0.08);

  --coral: #ff7a5c;
  --coral-dim: rgba(255,122,92,0.08);

  --gold: #ffd76a;
  --gold-dim: rgba(255,215,106,0.08);

  --slate: #7b8ba2;
  --slate-dim: rgba(123,139,162,0.08);

  --r: 12px;
  --r-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Figtree', sans-serif;
  background: var(--void);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── ANIMATED BG ── */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(0,240,255,0.03) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(180,122,255,0.025) 0%, transparent 60%);
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 20%, transparent 70%);
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,14,20,0.85);
  backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid var(--border2);
  padding: 0 28px;
}
.nav-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; height: 56px; gap: 10px;
}
.logo {
  display: flex; align-items: center; gap: 12px;
}
.logo-icon {
  width: 32px; height: 32px; border-radius: 10px;
  background: linear-gradient(135deg, var(--neon) 0%, var(--violet) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: var(--void);
  box-shadow: var(--neon-glow);
  font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: .02em;
}
.logo-text {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 18px; font-weight: 700; letter-spacing: -.01em; color: var(--text);
}
.logo-ver {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  color: var(--neon); background: var(--neon-dim);
  border: 1px solid rgba(0,240,255,0.15);
  padding: 2px 8px; border-radius: 99px; letter-spacing: .06em;
}
.nav-tabs {
  display: flex; gap: 2px; margin-left: 28px;
  background: var(--surface); border-radius: 10px;
  padding: 3px; border: 1px solid var(--border);
}
.nav-tab {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
  color: var(--text3); padding: 7px 16px; border-radius: 8px;
  cursor: pointer; transition: all .2s; border: none; background: none;
  letter-spacing: .03em; white-space: nowrap;
}
.nav-tab:hover { color: var(--text2); }
.nav-tab.active {
  color: var(--neon); background: var(--neon-dim);
  box-shadow: inset 0 0 12px rgba(0,240,255,0.05);
}
.nav-spacer { flex: 1; }
.nav-status {
  display: flex; align-items: center; gap: 8px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text3); letter-spacing: .04em;
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 8px var(--lime), 0 0 20px rgba(163,255,87,0.2);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

/* ── WEEK DAY SELECTOR ── */
.day-selector {
  display: flex; gap: 4px; background: var(--surface);
  border: 1px solid var(--border); padding: 4px;
  border-radius: var(--r-sm); margin-bottom: 20px;
  overflow-x: auto;
}
.day-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700;
  color: var(--text3); background: transparent; border: none;
  padding: 8px 16px; border-radius: 6px; cursor: pointer;
  transition: all .2s; letter-spacing: .05em;
}
.day-btn:hover { color: var(--text2); background: var(--surface2); }
.day-btn.active { color: var(--neon); background: var(--neon-dim); box-shadow: inset 0 0 8px rgba(0,240,255,0.05); }

/* ── CONTENT ── */
.content {
  position: relative; z-index: 1;
  max-width: 1400px; margin: 0 auto; padding: 24px 28px 80px;
}
.view { display: none; }
.view.active { display: block; animation: viewIn .4s ease; }
@keyframes viewIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* ── SECTION HEADER ── */
.sec-header { margin-bottom: 28px; }
.sec-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--neon); letter-spacing: .1em; text-transform: uppercase;
  margin-bottom: 10px;
}
