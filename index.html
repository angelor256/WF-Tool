* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Figtree', sans-serif; background: var(--void); color: var(--text); min-height: 100vh; overflow-x: hidden; }

.nav-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; height: 56px; gap: 10px; }
.logo { display: flex; align-items: center; gap: 12px; }

.logo-text { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; }

.nav-tab { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text3); padding: 7px 16px; border-radius: 8px; cursor: pointer; border: none; background: none; transition: all .2s; }
.nav-tab.active { color: var(--neon); background: var(--neon-dim); }
.content { max-width: 1400px; margin: 0 auto; padding: 24px 28px 80px; }
.view { display: none; } .view.active { display: block; }

.panel { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r); overflow: hidden; margin-bottom: 20px; }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.panel-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--text3); text-transform: uppercase; }
.panel-body { padding: 18px; }
