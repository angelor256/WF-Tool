<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetAnything Task Maker // Operación Diaria</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #06080c; --deep: #0b0e14; --surface: #0f1219; --surface2: #141820; --surface3: #1a1f2a;
  --border: rgba(255,255,255,0.05); --border2: rgba(255,255,255,0.08); --border3: rgba(255,255,255,0.12);
  --text: #eaf0ff; --text2: #8892a8; --text3: #4e5670; --neon: #00f0ff;
  --neon-dim: rgba(0,240,255,0.08); --neon-glow: 0 0 20px rgba(0,240,255,0.15);
  --lime: #a3ff57; --lime-dim: rgba(163,255,87,0.08); --lime-mid: rgba(163,255,87,0.15);
  --hot: #ff3d71; --blue: #4d8eff; --r: 12px; --r-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Figtree', sans-serif; background: var(--void); color: var(--text); min-height: 100vh; overflow-x: hidden; }
nav { position: sticky; top: 0; z-index: 100; background: rgba(11,14,20,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border2); padding: 0 28px; }
.nav-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; height: 56px; gap: 10px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--neon) 0%, #00c4cc 100%); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--void); box-shadow: var(--neon-glow); font-family: 'Bricolage Grotesque', sans-serif; }
.logo-text { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; }
.nav-tabs { display: flex; gap: 2px; margin-left: 28px; background: var(--surface); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
.nav-tab { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text3); padding: 7px 16px; border-radius: 8px; cursor: pointer; border: none; background: none; transition: all .2s; }
.nav-tab.active { color: var(--neon); background: var(--neon-dim); }
.content { max-width: 1400px; margin: 0 auto; padding: 24px 28px 80px; }
.view { display: none; } .view.active { display: block; }
.config-flow { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; background: var(--surface2); padding: 12px 18px; border-radius: var(--r-sm); border: 1px solid var(--border); }
select { background: var(--surface3); border: 1px solid var(--border3); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 8px 16px; border-radius: var(--r-sm); outline: none; }
.panel { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r); overflow: hidden; margin-bottom: 20px; }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.panel-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--text3); text-transform: uppercase; }
.panel-body { padding: 18px; }
.drop-zone { border: 1.5px dashed var(--border3); border-radius: var(--r); padding: 40px 24px; text-align: center; cursor: pointer; background: var(--surface2); transition: all .25s; margin-bottom: 16px; }
.drop-zone.dragover { border-color: var(--neon); background: var(--neon-dim); }
.dz-icon { font-size: 32px; margin-bottom: 10px; }
.dz-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.dz-sub { font-size: 11px; color: var(--text3); }
.dz-sub span { color: var(--neon); text-decoration: underline; }
.days-container { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
.day-btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: bold; padding: 8px 16px; border-radius: var(--r-sm); cursor: pointer; }
.day-btn.active { background: var(--neon-dim); border-color: var(--neon); color: var(--neon); box-shadow: var(--neon-glow); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { text-align: left; padding: 12px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text2); background: var(--surface2); border-bottom: 1px solid var(--border2); }
tbody tr { border-bottom: 1px solid var(--border); }
td { padding: 12px 14px; white-space: nowrap; }
.tag-casino { color: var(--hot); font-weight: bold; font-family: 'IBM Plex Mono', monospace; }
.tag-vip { color: var(--blue); font-weight: bold; font-family: 'IBM Plex Mono', monospace; }
.tag-secundaria { color: var(--lime); font-family: 'IBM Plex Mono', monospace; }
.btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; border: none; border-radius: var(--r-sm); padding: 12px 24px; cursor: pointer; text-transform: uppercase; }
.btn-glow { background: linear-gradient(135deg, var(--neon) 0%, #00c4cc 100%); color: var(--void); font-weight: 800; box-shadow: var(--neon-glow); }
.upload-success { display: none; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r-sm); background: var(--lime-dim); border: 1px solid var(--lime-mid); margin-bottom: 16px; color: var(--lime); font-size: 12px; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo"><div class="logo-icon">BA</div><span class="logo-text">BetAnything Task Maker</span></div>
    <div class="nav-tabs">
      <button class="nav-tab active" id="tab-config" onclick="switchMainView('config')">CARGAR DATOS</button>
      <button class="nav-tab" id="tab-dashboard" onclick="switchMainView('dashboard')">TABLA DE TAREAS</button>
    </div>
  </div>
</nav>

<div class="content">
  <div id="view-config" class="view active">
    <div class="panel">
      <div class="panel-head"><span class="panel-label">CARGA DE AGENTES ACTIVOS POR DÍA</span></div>
      <div class="panel-body">
        <div class="config-flow">
          <label style="font-size:12px; font-weight:600; color:var(--text2)">1. Selecciona el Día de esta pestaña:</label>
          <select id="select-dia-carga">
            <option value="Lunes">LUNES</option>
            <option value="Martes">MARTES</option>
            <option value="Miercoles">MIÉRCOLES</option>
            <option value="Jueves">JUEVES</option>
            <option value="Viernes">VIERNES</option>
            <option value="Sabado">SÁBADO</option>
            <option value="Domingo">DOMINGO</option>
          </select>
        </div>
        <div class="drop-zone" id="drop-zone">
          <div class="dz-icon">📋</div>
          <div class="dz-title">Arrastra el archivo CSV de este día aquí</div>
          <div class="dz-sub">o haz clic para <span>buscar el archivo</span></div>
          <input type="file" id="csv-file-input" accept=".csv,.txt" style="display:none">
        </div>
        <div class="upload-success" id="upload-status-box">
          <span>✓</span> <span id="upload-status-text">Listo.</span>
        </div>
        <div style="text-align: center; margin-top: 20px;">
          <button class="btn btn-glow" onclick="procesarDiaActual()">⚡ ASIGNAR TAREAS PARA ESTE DÍA</button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-dashboard" class="view">
    <div class="days-container">
      <button class="day-btn active" id="btn-Lunes" onclick="seleccionarDia('Lunes')">LUNES</button>
      <button class="day-btn" id="btn-Martes" onclick="seleccionarDia('Martes')">MARTES</button>
      <button class="day-btn" id="btn-Miercoles" onclick="seleccionarDia('Miercoles')">MIÉRCOLES</button>
      <button class="day-btn" id="btn-Jueves" onclick="seleccionarDia('Jueves')">JUEVES</button>
      <button class="day-btn" id="btn-Viernes" onclick="seleccionarDia('Viernes')">VIERNES</button>
      <button class="day-btn" id="btn-Sabado" onclick="seleccionarDia('Sabado')">SÁBADO</button>
      <button class="day-btn" id="btn-Domingo" onclick="seleccionarDia('Domingo')">DOMINGO</button>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-label" id="tabla-titulo">CRONOGRAMA DE OPERACIONES: LUNES</span></div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>AGENTE</th><th>HORARIO</th><th>ESTADO</th><th>TAREA PRINCIPAL</th><th>RESPONSABILIDAD SECUNDARIA</th></tr>
          </thead>
          <tbody id="tabla-agentes-body">
            <tr><td colspan="5" style="text-align:center; color:var(--text3); padding:30px;">No hay datos cargados para este día.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let datosSemanales = { "Lunes": [], "Martes": [], "Miercoles": [], "Jueves": [], "Viernes": [], "Sabado": [], "Domingo": [] };
let diaSeleccionadoActual = "Lunes";
let contenidoCSVBruto = "";

function switchMainView(viewName) {
  document.getElementById('tab-config').classList.remove('active');
  document.getElementById('tab-dashboard').classList.remove('active');
  document.getElementById('view-config').classList.remove('active');
  document.getElementById('view-dashboard').classList.remove('active');
  if(viewName === 'config') {
    document.getElementById('tab-config').classList.add('active');
    document.getElementById('view-config').classList.add('active');
  } else {
    document.getElementById('tab-dashboard').classList.add('active');
    document.getElementById('view-dashboard').classList.add('active');
    renderizarTablaDia(diaSeleccionadoActual);
  }
}

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('csv-file-input');
if (dropZone && fileInput) {
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); if(e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]); });
}

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    contenidoCSVBruto = e.target.result;
    document.getElementById('upload-status-box').style.display = 'flex';
    document.getElementById('upload-status-text').textContent = `Archivo "${file.name}" cargado en memoria.`;
  };
  reader.readAsText(file);
}

function procesarDiaActual() {
  if(!contenidoCSVBruto || contenidoCSVBruto.trim() === "") {
    alert("Por favor, selecciona o arrastra el archivo .csv del día primero.");
    return;
  }

  let diaDestino = document.getElementById('select-dia-carga').value;
  datosSemanales[diaDestino] = []; 

  // Separar líneas limpiando retornos de carro defectuosos
  const lineas = contenidoCSVBruto.split(/\r?\n/);
  
  for (let i = 1; i < lineas.length; i++) {
    let lineaLimpia = lineas[i].trim();
    if (!lineaLimpia) continue;
    
    // Auto-detectar si Excel usó coma o punto y coma
    let columnas = [];
    if (lineaLimpia.includes(';')) {
      columnas = lineaLimpia.split(';');
    } else {
      columnas = lineaLimpia.split(',');
    }
    
    let agente = columnas[0]?.replace(/"/g, '').trim();
    let entrada = columnas[1]?.replace(/"/g, '').trim();
    let salida = columnas[2]?.replace(/"/g, '').trim();

    if(!agente || agente.toLowerCase() === "agente") continue;

    datosSemanales[diaDestino].push({
      nombre: agente,
      entrada: entrada || '--',
      salida: salida || '--',
      estado: 'WORK',
      tareaPrincipal: 'Pendiente',
      tareaSecundaria: 'Ninguna'
    });
  }

  if(datosSemanales[diaDestino].length === 0) {
    alert("El archivo se leyó pero no se encontraron agentes. Verifica que las columnas estén en orden: Agente, Entrada, Salida.");
    return;
  }

  ejecutarAlgoritmoDia(diaDestino);
  diaSeleccionadoActual = diaDestino;
  seleccionarDia(diaDestino);
  switchMainView('dashboard');
  
  // Limpieza de inputs
  contenidoCSVBruto = "";
  document.getElementById('upload-status-box').style.display = 'none';
  if(fileInput) fileInput.value = "";
}

function ejecutarAlgoritmoDia(dia) {
  let activos = datosSemanales[dia];
  activos.forEach((agente, index) => {
    if (index % 3 === 0) { agente.tareaPrincipal = 'Casino'; }
    else if (index % 3 === 1) { agente.tareaPrincipal = 'VIP'; }
    else { agente.tareaPrincipal = 'Soporte General'; }
  });

  let secundarias = ['Zelle Blast', 'Bonus Check', 'Email FollowUp'];
  let idxSecundario = 0;
  activos.forEach(agente => {
    if (agente.tareaPrincipal === 'Casino') {
      agente.tareaSecundaria = 'EXENTO (Casino Dedicado)';
    } else {
      agente.tareaSecundaria = secundarias[idxSecundario % secundarias.length];
      idxSecundario++;
    }
  });
}

function seleccionarDia(dia) {
  diaSeleccionadoActual = dia;
  document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
  const botonActivo = document.getElementById(`btn-${dia}`);
  if(botonActivo) botonActivo.classList.add('active');
  document.getElementById('tabla-titulo').textContent = `CRONOGRAMA DE OPERACIONES: ${dia.toUpperCase()}`;
  renderizarTablaDia(dia);
}

function renderizarTablaDia(dia) {
  const tbody = document.getElementById('tabla-agentes-body');
  const agentes = datosSemanales[dia];
  if (!agentes || agentes.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text3); padding:30px;">No hay datos cargados para el día ${dia}.</td></tr>`;
    return;
  }
  let html = "";
  agentes.forEach(a => {
    let clasePrincipal = "";
    if(a.tareaPrincipal === 'Casino') clasePrincipal = 'class="tag-casino"';
    if(a.tareaPrincipal === 'VIP') clasePrincipal = 'class="tag-vip"';
    html += `<tr>
      <td style="font-weight:600; color:var(--text);">${a.nombre}</td>
      <td style="font-family:'IBM Plex Mono', monospace;">${a.entrada} - ${a.salida}</td>
      <td style="font-weight:bold; color:var(--lime);">ACTIVE</td>
      <td ${clasePrincipal}>${a.tareaPrincipal}</td>
      <td class="tag-secundaria" style="opacity:${a.tareaPrincipal === 'Casino' ? '0.4' : '1'};">${a.tareaSecundaria}</td>
    </tr>`;
  });
  tbody.innerHTML = html;
}
</script>
</body>
</html>
